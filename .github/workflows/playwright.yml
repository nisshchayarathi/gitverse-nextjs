name: Playwright Tests
on:
  push:
    branches: [ main, master, feat/*, fix/*, dev ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Generate Prisma Client
      run: npx prisma generate
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npm run test:e2e
      env:
        CI: true
        # Stub env vars so dev server starts without real secrets
        DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_db
        JWT_SECRET: ci-jwt-secret-for-e2e-testing
        NEXTAUTH_SECRET: ci-nextauth-secret-for-e2e-testing
        NEXTAUTH_URL: http://localhost:3000
        GEMINI_API_KEY: ci-gemini-key-placeholder
        DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        JWT_SECRET: "dummy-secret"
        NEXTAUTH_SECRET: "dummy-secret"
        NEXTAUTH_URL: "http://localhost:3000"
        GEMINI_API_KEY: "dummy-key"
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
