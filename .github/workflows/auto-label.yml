name: Auto-Label Issues

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title.toLowerCase();
            const body = (context.payload.issue.body || '').toLowerCase();
            const text = title + ' ' + body;
            const currentLabels = context.payload.issue.labels.map(l => l.name);
            const labelsToAdd = new Set();

            const patterns = {
              'gssoc-2026': [/gssoc/i, /gsoc/i, /google summer of code/i, /world gssoc/i],
              'bug': [/\bbug\b/i, /\bfix\b/i, /\bcrash\b/i, /\berror\b/i, /\bbroken\b/i],
              'feature': [/\bfeat\b/i, /\bfeature\b/i, /\benhancement\b/i, /\badd\b/i, /\bnew\b/i],
              'documentation': [/\bdoc\b/i, /\bdocs\b/i, /\breadme\b/i, /\bguide\b/i],
              'ui': [/\bui\b/i, /\bux\b/i, /\bdesign\b/i, /\bstyle\b/i, /\bcss\b/i],
              'performance': [/\bperf\b/i, /\bperformance\b/i, /\bslow\b/i, /\boptimize\b/i],
            };

            for (const [label, regexes] of Object.entries(patterns)) {
              if (currentLabels.includes(label)) continue;
              if (regexes.some(r => r.test(text))) {
                labelsToAdd.add(label);
              }
            }

            if (labelsToAdd.size > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels: [...labelsToAdd],
              });
            }
