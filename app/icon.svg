<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
  </defs>
  
  <!-- Git Branching Paths -->
  <path d="M 192 412 L 192 100" stroke="url(#grad)" stroke-width="32" stroke-linecap="round" fill="none" />
  <path d="M 192 280 C 260 280, 320 240, 320 180 L 320 130" stroke="url(#grad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <!-- Outer Rings for Nodes -->
  <circle cx="192" cy="100" r="40" fill="#0B0F19" stroke="url(#grad)" stroke-width="12" />
  <circle cx="192" cy="412" r="40" fill="#0B0F19" stroke="url(#grad)" stroke-width="12" />
  <circle cx="320" cy="130" r="40" fill="#0B0F19" stroke="url(#grad)" stroke-width="12" />
  <circle cx="192" cy="256" r="30" fill="#0B0F19" stroke="url(#grad)" stroke-width="10" />

  <!-- Inner Nodes -->
  <circle cx="192" cy="100" r="16" fill="#3B82F6" />
  <circle cx="192" cy="412" r="16" fill="#6366F1" />
  <circle cx="320" cy="130" r="16" fill="#10B981" />
  <circle cx="192" cy="256" r="10" fill="#10B981" />
</svg>
